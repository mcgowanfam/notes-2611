<title>London · Nov 2026</title><style>/* Fonts: Cabin and Libre Baskerville, SIL Open Font License 1.1, self-hosted */
@font-face{font-family:"Cabin";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/cabin.woff2) format("woff2")}
@font-face{font-family:"Libre Baskerville";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baskerville-bold.woff2) format("woff2")}
:root{--navy:#0a2240;--red:#c8102e;--cream:#f6f1e6;--paper:#fffdf8;--brass:#a8862f;--brass2:#e9dcb8;--ink:#1a1d24;--mute:#5d6170;--line:#e4dccb;
 --walk:#2f7d4f;--uber:#22252b;--picc:#003688;--north:#000;--vic:#0098d4;--eliz:#6950a1;--tube:#003688;
 --sans:"Cabin",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:"Libre Baskerville",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.42 var(--sans);background:var(--cream);color:var(--ink)}
button,input,select{font-family:inherit}
/* header: navy band with a skyline silhouette */
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;position:relative;overflow:hidden}
.hd{display:flex;align-items:baseline;gap:10px;position:relative;z-index:1}
.hd .ttl{font-family:var(--serif);font-size:24px;letter-spacing:.01em}
.hd .dts{font-size:14px;color:#e9dcb8;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.sky{display:block;width:100%;height:58px;color:#2b4b7a;margin-top:-4px}
.rule{height:6px;margin:0 -16px;background:linear-gradient(var(--red) 0 2px,#fff 2px 4px,#7a93b8 4px 6px)}
main{padding:12px 12px calc(92px + env(safe-area-inset-bottom))}
.tab{display:none}.tab.on{display:block}
/* enamel street-name signs */
h2.sign{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 2px 4px;padding:9px 14px;background:#fff;border:3px solid #1a1a1a;border-radius:8px;
 box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--red),0 2px 0 rgba(0,0,0,.12);font:700 21px/1.1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:#111}
h2.sign .pc{color:var(--red);font-size:16px;letter-spacing:.06em}
h2.sign .st:after{content:"·";color:#999;margin-left:10px}
.subt{text-align:center;font-family:var(--serif);font-size:15px;color:var(--navy);margin:2px 4px 12px}
h2{font-family:var(--serif);font-size:21px;margin:6px 4px 10px;color:var(--navy)}h2 small{display:block;font:500 15px var(--sans);color:var(--mute)}
h3{font-family:var(--serif);font-size:17px;margin:22px 4px 9px;color:var(--navy);padding-bottom:5px;border-bottom:2px solid var(--brass2)}
.priv{display:inline-block;font-size:12px;font-weight:600;color:#7d1424;background:#f9e3e5;border-radius:6px;padding:3px 8px;margin:2px 4px 0}
.mapbtn{display:block;position:relative;width:100%;padding:0;border:2px solid #fff;border-radius:14px;overflow:hidden;background:#ddd;box-shadow:0 1px 4px rgba(10,34,64,.2)}
.mapbtn img{display:block;width:100%;height:auto}
.zoomhint{position:absolute;right:8px;bottom:8px;background:rgba(10,34,64,.82);color:#fff;font-size:13px;padding:4px 10px;border-radius:999px}
.cap{font-size:13px;color:var(--mute);margin:5px 4px 8px}
.thumbs{display:flex;gap:8px;margin:0 0 10px}
.thumb{flex:1;border:0;padding:0;background:var(--paper);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(10,34,64,.18);text-align:left}
.thumb img{display:block;width:100%;height:90px;object-fit:cover}.thumb span{display:block;font-size:12.5px;padding:5px 7px;color:var(--ink)}
.sum{background:#fff;border-left:4px solid var(--brass);border-radius:8px;padding:9px 12px;font-size:14.5px;margin:4px 0 12px;box-shadow:0 1px 2px rgba(10,34,64,.08)}
.note{border-radius:10px;padding:10px 12px;font-size:14.5px;margin:6px 0 12px}.note.warn{background:#fff5d9;border:1px solid #e8cf86}
/* timeline */
.tl{position:relative;margin-left:2px}
.item{display:flex;gap:10px;margin-bottom:10px;position:relative}
.item:before{content:"";position:absolute;left:15px;top:30px;bottom:-12px;width:3px;background:#d8cfbd}
.item:last-child:before{display:none}
.dot{flex:0 0 32px;height:32px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:1;background:var(--lc);box-shadow:0 0 0 3px var(--cream)}
.item{--lc:var(--navy)}
.item.walk{--lc:var(--walk)}.item.uber{--lc:var(--uber)}.item.tube{--lc:var(--tube)}
.item.ln-picc{--lc:var(--picc)}.item.ln-north{--lc:var(--north)}.item.ln-vic{--lc:var(--vic)}.item.ln-eliz{--lc:var(--eliz)}
.walk .dot,.uber .dot,.tube .dot{background:var(--lc)}
.stop .dot{background:#fff;color:var(--red);border:3px solid var(--red)}
.card{flex:1;min-width:0;background:var(--paper);border-radius:4px 12px 12px 4px;padding:10px 12px;box-shadow:0 1px 3px rgba(10,34,64,.12);border-left:5px solid var(--lc)}
.stop .card{background:#fff;border-left-color:var(--red);box-shadow:0 1px 3px rgba(10,34,64,.12)}
.top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.time{font-weight:700;font-size:15.5px;color:var(--navy)}.dur{margin-left:auto;font-size:13px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;border-radius:999px;padding:2px 9px 2px 6px;background:var(--lc)}
.badge .mi{width:14px;height:14px;fill:currentColor;flex:0 0 14px}
.badge.stop{background:var(--red)}
.title{font-weight:700;font-size:16.5px;margin:6px 0 3px;color:#111}.body{font-size:15px;color:#2e323b}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.btn{flex:1 1 40%;display:flex;align-items:center;justify-content:center;min-height:44px;padding:8px 10px;border-radius:10px;font-weight:700;font-size:14.5px;text-decoration:none;text-align:center}
.btn.sm{min-height:40px;font-size:14px}
.btn.g{background:var(--navy);color:#fff}.btn.a{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.u{background:#111;color:#fff;flex-basis:100%}.btn.x{background:#fff;color:var(--red);border:1.5px solid #e3b5bc;flex-basis:100%}
.places{background:var(--paper);border-radius:12px;margin:14px 0;box-shadow:0 1px 3px rgba(10,34,64,.12);border-top:3px solid var(--brass)}
.places summary{padding:14px;font-weight:700;cursor:pointer;color:var(--navy)}
.places ul{list-style:none;margin:0;padding:0 8px 8px}
.places li{display:flex;align-items:center;gap:6px;padding:5px 4px;border-top:1px solid var(--line);font-size:14.5px}
.places li span{flex:1}
.pin{min-width:68px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:9px;text-decoration:none;font-weight:700;font-size:13.5px}
.pin.g{background:var(--navy);color:#fff}.pin.a{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.res{background:var(--paper);border-radius:4px 12px 12px 4px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(10,34,64,.12);border-left:5px solid var(--navy)}
.rwhen{font-size:13px;color:var(--red);font-weight:700;letter-spacing:.04em;text-transform:uppercase}.rtitle{font-family:var(--serif);font-weight:700;font-size:17px;margin:3px 0 4px;color:var(--navy)}.rbody{font-size:14.5px;color:#2e323b}
a.tel{color:var(--navy);font-weight:700;text-decoration:underline;text-decoration-color:var(--brass);white-space:nowrap}
.secret:empty{display:none}
.conf{margin-top:9px;background:#f3f7ef;border:1px solid #cddfc6;border-radius:10px;padding:8px 10px}
.conf div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}.conf div span{color:var(--mute)}
.conf b{font-family:ui-monospace,Menlo,monospace;font-size:14.5px;letter-spacing:.03em;user-select:all;-webkit-user-select:all;text-align:right;word-break:break-all}
.conf .btn{margin-top:6px}
.locked{font-size:13px;color:var(--mute);margin-top:7px}
.lock{background:#fff;border:1.5px dashed #b9aa86;border-radius:12px;padding:12px;font-size:14.5px;margin-bottom:6px}
.lock form,.lockscreen form{display:flex;gap:8px;margin-top:12px}
.lock input,.lockscreen input{flex:1;min-width:0;font-size:18px;padding:10px 12px;border:1.5px solid #c8bfa8;border-radius:10px;letter-spacing:.1em;background:#fff}
.lock button,.lockscreen button{font-size:16px;font-weight:700;padding:0 18px;border:0;border-radius:10px;background:var(--red);color:#fff;min-height:46px}
.lockmsg{font-size:13.5px;color:#a11;margin-top:6px}
.lock.ok{border-style:solid;border-color:#cddfc6;background:#f3f7ef}
#relock{color:var(--navy)!important}
.foot{font-size:12.5px;color:var(--mute);text-align:center;margin:16px 0}
/* bottom tabs: roundel-inspired */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--paper);border-top:3px solid var(--navy);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(10,34,64,.12)}
nav.tabs button{flex:1;border:0;background:none;padding:7px 2px 6px;min-height:62px;color:#6b6f7a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rnd{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:34px}
.rnd i{position:absolute;width:34px;height:34px;border-radius:50%;border:6px solid #cfc7b6;left:50%;margin-left:-17px;top:0}
.rnd b{position:relative;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:var(--paper);color:#5d6170;font-weight:700;line-height:1.2}
nav.tabs .dd{font-size:11.5px;font-weight:600;min-height:14px}
nav.tabs button.on .rnd i{border-color:var(--red)}
nav.tabs button.on .rnd b{background:var(--navy);color:#fff}
nav.tabs button.on .dd{color:var(--navy)}
/* map viewer */
#viewer{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
#viewer[hidden]{display:none}
.vbar{display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.vbar button{font-size:17px;font-weight:700;color:#fff;background:#333;border:0;border-radius:10px;padding:10px 18px;min-height:44px}
.vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.vscroll img{display:block;width:100%;height:auto}
.vscroll.z2 img{width:200%}.vscroll.z3 img{width:300%}
/* Monday arrival options */
.opts{margin-bottom:10px}
.optbar{display:flex;gap:8px;margin:0 0 10px 42px}
.opt{flex:1;border:2px solid #d3c9b2;background:#fff;border-radius:12px;padding:8px 6px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);font-size:15px}
.opt small{font-size:12px;color:var(--mute)}
.opt.on{border-color:var(--navy);background:var(--navy);color:#fff}.opt.on small{color:#e9dcb8}
.optpanel[hidden]{display:none}
.cmp{display:flex;gap:6px;margin:9px 0 4px}
.cmp div{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center;font-size:12.5px}
.cmp b{display:block;font-size:12.5px}.cmp span{font-size:14px;font-weight:700;color:var(--navy)}
.fine{font-size:12.5px;color:var(--mute);margin:4px 0 8px}
.warnbox{background:#fbeaec;border:1px solid #efb7be;color:#7d1424;border-radius:9px;padding:8px 10px;margin:8px 0;font-size:14px}
.card .mapbtn{margin-top:10px}
.backup{margin:0 0 12px 42px}
.backup .bk{padding:0 14px 14px;font-size:14.5px;color:#2e323b}
.okbox{background:#edf6ea;border:1px solid #b9d9b2;color:#1d5a20;border-radius:9px;padding:8px 10px;margin:8px 0;font-size:14px;font-weight:600}
/* quiz rounds */
.item.hci{--lc:var(--brass)}
.item.hci .dot.q{background:var(--navy);color:#f0d27a;border:2px solid var(--brass)}
.item.hci .card{background:#fffaf0;border-left-color:var(--brass)}
.hc .trk{font-size:12px;font-weight:700;letter-spacing:.05em;color:#7d6220;text-transform:uppercase}
.hc .trt{font-family:var(--serif);font-weight:700;font-size:16px;margin:2px 0 0;color:var(--navy)}
.hc .trp{color:var(--mute);font-size:14px;margin-bottom:6px}
.hc .tq{border-top:1px solid #ece2c8;padding:9px 0 6px}
.hc .tqh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--red);letter-spacing:.03em;font-weight:700}
.hc .scope{font-size:11px;color:#555;background:#f1ead8;border-radius:6px;padding:1px 6px;white-space:nowrap;align-self:flex-start;font-weight:600}
.hc .tqt{font-size:15.5px;margin:5px 0 6px;line-height:1.38}
.hc details{margin:5px 0;border-radius:9px;background:#fff;border:1px solid #e3d7b6}
.hc details>summary{list-style:none;cursor:pointer;padding:9px 11px;font-weight:700;font-size:14.5px;color:var(--navy);min-height:24px}
.hc details>summary::-webkit-details-marker{display:none}
.hc details>div{padding:0 11px 10px;font-size:14.5px;line-height:1.42}
.hc details.ta{background:#eef2f8;border-color:#c5d0e2}
.hc details.ta[open]{background:#fff8e1;border-color:#e4c766}
.hc .tsc{display:flex;align-items:center;gap:6px;font-size:13.5px;color:#555;margin-top:4px}
.hc .tsc select{font-size:15px;padding:5px 8px;border-radius:8px;border:1px solid #c8bfa8;background:#fff;min-width:64px}
.hc .trtot{font-size:14px;margin:8px 0 2px;color:#333}
.hc.how ul{margin:6px 0 4px;padding-left:18px;font-size:14px;line-height:1.42}.hc.how li{margin:3px 0}
.hc .treset{margin-left:8px;border:0;background:none;color:var(--red);font-weight:700;font-size:13.5px;padding:6px}
.hc details[open]>summary .c,.hc details:not([open])>summary .o{display:none}
.rdx>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:32px;font-weight:700;font-size:16px;color:var(--navy)}
.rdx>summary::-webkit-details-marker{display:none}
.rdx>summary .rdt{flex:1;font-family:var(--serif);font-size:15.5px}.rdx>summary .rdsc{font-size:13px;font-weight:700;color:#5c4710;background:var(--brass2);border-radius:999px;padding:2px 9px}
.rdx>summary .rdc{font-size:16px;color:var(--brass);transition:transform .15s}.rdx[open]>summary .rdc{transform:rotate(90deg)}
.rdx[open]>summary{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #ece2c8}
.hc .stl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7d6220;margin:2px 0 4px}
.hc details.tafter>div{font-size:15.5px;line-height:1.52}
/* lock screen */
.lockscreen{background:var(--paper);border-radius:14px;padding:26px 18px 22px;margin:22px 2px;text-align:center;box-shadow:0 1px 4px rgba(10,34,64,.15);border-top:5px solid var(--red)}
.lsr{position:relative;width:76px;height:76px;margin:0 auto 4px}
.lsr i{position:absolute;inset:0;border-radius:50%;border:11px solid var(--red)}
.lsr b{position:absolute;left:-8px;right:-8px;top:27px;height:22px;background:var(--navy);border-radius:2px;display:flex;align-items:center;justify-content:center}
.lsr svg{width:14px;height:14px;fill:#fff}
.lockscreen .lst{font-family:var(--serif);font-weight:700;font-size:19px;margin:10px 0 2px;color:var(--navy)}
.lockscreen .lss{font-size:14.5px;color:var(--mute)}
.lockscreen .lockmsg{font-size:13.5px;color:#a11;margin-top:8px}
.lzn{margin:10px 2px}
/* check-offs */
.dprog{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;margin:0 -12px 12px;padding:8px 12px;background:rgba(246,241,230,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
.dprog .dpt{font-weight:700;font-size:14px;color:var(--navy);white-space:nowrap}
.dprog .dpb{flex:1;height:8px;border-radius:99px;background:#e2d9c4;overflow:hidden}.dprog .dpb i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .25s}
.dprog.all .dpb i{background:var(--walk)}
.dnext{border:0;background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;border-radius:999px;padding:8px 13px;min-height:36px;white-space:nowrap}
.dnext[disabled]{opacity:.45}
.dbar{display:flex;justify-content:flex-end;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.opts>.dbar{margin-left:42px}
.dbtn{min-height:44px;min-width:46%;border:2px solid var(--walk);background:#fff;color:var(--walk);font-weight:700;font-size:15.5px;border-radius:999px;padding:6px 16px}
.sec.done .dbtn{border-color:#b9aa86;color:var(--mute);background:#fff}
.drow{display:none;width:100%;align-items:center;gap:9px;text-align:left;border:0;background:#ebe5d6;border-radius:10px;padding:9px 12px;min-height:46px;color:#6f6a5e;font-size:15px}
.sec.done>.drow{display:flex}
.sec.done:not(.peek)>:not(.drow){display:none!important}
.sec.done:not(.peek){margin-bottom:6px}
.sec.done:before{display:none}
.sec.done.peek>.drow{margin-bottom:6px}
.sec.done.peek{flex-wrap:wrap}
.drow .dtick{flex:0 0 26px;height:26px;border-radius:50%;background:var(--walk);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.drow .dt{font-weight:700;font-size:13.5px;white-space:nowrap}
.drow .dn{flex:1;min-width:0;text-decoration:line-through;text-decoration-color:#9b9484;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dx{color:#9b9484;font-size:13px;transition:transform .15s}.sec.peek .drow .dx{transform:rotate(90deg)}
.sub.hid{display:none!important}
.dreset{text-align:center;margin:14px 0 4px}
.dreset button{border:0;background:none;color:var(--red);font-weight:700;font-size:14px;text-decoration:underline;padding:10px}
.sec.flash>.card,.sec.flash.opts{animation:fl 1.2s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--brass)}100%{box-shadow:0 1px 3px rgba(10,34,64,.12)}}
details.film{margin:8px 0 2px}
details.film>summary{display:inline-flex;align-items:center;gap:5px;list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--navy);border:1.5px solid var(--navy);border-radius:999px;padding:4px 11px;background:var(--paper);-webkit-tap-highlight-color:transparent}
details.film>summary::-webkit-details-marker{display:none}
details.film>summary::before{content:"▸";font-size:11px;color:var(--red)}
details.film[open]>summary::before{content:"▾"}
details.film[open]>summary{background:var(--navy);color:#fff}
details.film .fb{margin-top:8px;background:#fbf7ee;border:1px solid #e4dcc8;border-left:4px solid var(--red);border-radius:9px;padding:9px 11px;font-size:14px;line-height:1.45}
details.film .fb>div{margin:3px 0}details.film .fb ul{margin:3px 0 0;padding-left:18px}
details.film .fc{color:#7d1424}
details.film a.clip{display:flex;align-items:center;gap:10px;margin:10px 0 3px;padding:6px 10px 6px 6px;border-radius:9px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;min-height:44px}
details.film a.clip img{width:96px;height:54px;border-radius:6px;object-fit:cover;background:#33496b;flex:none}
details.film a.clip span{flex:1}
details.film .ct{font-size:12.5px;color:var(--mute);line-height:1.35}
details.film .cn{font-size:12px;color:#7d1424;font-style:italic;margin-top:2px}

.safe{background:#eef4fb;border:1px solid #bcd3ee;color:#183a63;border-radius:9px;padding:7px 10px;margin:8px 0;font-size:14px}
.note.safe-top{background:#eef4fb;border:1px solid #bcd3ee;color:#183a63}

/* home screen + live weather (public) */
nav.tabs button{min-width:0}
nav.tabs .rnd b{font-size:11px;letter-spacing:.03em;padding:2px 4px;white-space:nowrap}
.wx{background:var(--navy);color:#fff;border-radius:12px;padding:11px 12px 9px;margin:4px 0 14px;box-shadow:0 1px 4px rgba(10,34,64,.25);border-bottom:4px solid var(--brass)}
.wxh{display:flex;align-items:baseline;gap:8px}
.wxt{font-family:var(--serif);font-size:16px}
.wxs{margin-left:auto;font-size:12px;color:var(--brass2)}
.wxnow{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:6px 0 8px}
.wxnow:empty{display:none}
.wxnow .t{font-size:26px;font-weight:700;line-height:1.1}
.wxnow .f{font-size:14px;color:var(--brass2)}
.wxnow .c{font-size:16px;font-weight:700}
.wxnow .x{flex-basis:100%;font-size:13px;color:#cdd6e4}
.wxdays{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.wxdays:empty{display:none}
.wxd{background:rgba(255,255,255,.08);border-radius:8px;padding:6px 3px;text-align:center;font-size:12px;line-height:1.3}
.wxd.today{box-shadow:inset 0 0 0 1.5px var(--brass2)}
.wxd .dn{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11.5px}
.wxd .dc{font-weight:700;margin:2px 0;font-size:12px}
.wxd .hi{font-size:14px;font-weight:700}.wxd .lo,.wxd .ff{color:#cdd6e4}.wxd .rp{color:var(--brass2);margin-top:2px}
.wxsrc{font-size:11px;color:#9fb0c8;margin-top:7px;text-align:right}.wxsrc a{color:#cdd6e4}
.wxerr{font-size:14px;color:#e9dcb8;margin:6px 0 2px}
.hlist{background:var(--paper);border-radius:12px;box-shadow:0 1px 3px rgba(10,34,64,.12);border-top:3px solid var(--brass);overflow:hidden;margin:6px 0 12px}
.hrow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:13px 14px;font-size:15.5px;text-align:left;color:var(--ink);cursor:pointer}
.hrow:first-child{border-top:0}.hrow.off{cursor:default;color:var(--mute)}
.hd1{flex:0 0 78px;font-weight:700;color:var(--navy)}.hrow.off .hd1{color:var(--mute)}
.hd2{flex:1;min-width:0}.hx{color:var(--red);font-size:20px;font-weight:700;line-height:1}
/* login gate */
.gate{padding:28px 16px 40px}.gate[hidden]{display:none}
.gbox{max-width:420px;margin:0 auto;background:var(--paper);border-radius:12px;border-top:3px solid var(--brass);box-shadow:0 1px 3px rgba(10,34,64,.12);padding:18px 16px}
.gt{font-family:var(--serif);font-size:21px;color:var(--navy)}.gs{font-size:15px;color:var(--mute);margin-top:4px}
#gform{display:flex;gap:8px;margin-top:14px}
#gform input{flex:1;min-width:0;font-size:18px;padding:10px 12px;border:1.5px solid #c8bfa8;border-radius:10px;background:#fff}
#gform button{border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;padding:0 18px;min-height:46px}
.gmsg{font-size:14px;margin-top:8px;min-height:18px}
